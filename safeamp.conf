# ==============================================================================
# SafeAMP Nginx Production Hardened Configuration
# ==============================================================================

# API Rate Limiting Zone: 10MB state store (~160k IPs), 15 req/sec baseline
limit_req_zone $binary_remote_addr zone=safeamp_api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name 62.234.141.184 127.0.0.1 localhost;

    # Maximum upload size for FASTA / batch files (15MB)
    client_max_body_size 15M;

    # --------------------------------------------------------------------------
    # Gzip High-Efficiency Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Production Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for Vite React SPA
    root /home/ubuntu/safeamp-server/frontend/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite builds use content-hash filenames in /assets/)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Fallback (index.html should not be aggressively cached)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # Backend FastAPI Reverse Proxy with Burst Buffer & Timeouts
    # --------------------------------------------------------------------------
    location /api/ {
        # Burst buffer for concurrency surges, nodelay allows immediate service up to limit
        limit_req zone=safeamp_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for heavy ML batch inference and DeepSeek LLM report generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Disable buffering to allow smooth streaming or immediate batch status updates
        proxy_buffering off;
    }
}
